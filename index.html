<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🔤</text></svg>">
<title>DOOM on regex - find &amp; replace as a computer</title>
<style>
  :root {
    --bg: #0d0b0a; --panel: #171310; --panel2: #1f1a15;
    --fg: #d8d2c8; --dim: #8a8378; --red: #c23b22; --red2: #e4572e;
    --green: #7bc96f; --amber: #e0a458; --line: #2c251e;
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.65 Georgia, "Times New Roman", serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
  a { color: var(--red2); }
  h1, h2 { font-family: Verdana, Geneva, sans-serif; letter-spacing: -0.5px; }
  h1 { font-size: clamp(28px, 5vw, 46px); margin: 0.3em 0; }
  h2 { font-size: 24px; margin: 2.2em 0 0.6em; color: var(--amber); }
  .mono, code, pre, textarea { font-family: var(--mono); }
  code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 0.85em; }
  .dim { color: var(--dim); }

  header { padding: 42px 0 8px; text-align: center; }
  .lang { position: fixed; top: 14px; right: 16px; z-index: 9; }
  .lang button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    padding: 5px 12px; cursor: pointer; font: inherit; border-radius: 6px;
  }
  .lang button.on { background: var(--red); border-color: var(--red); color: #fff; }

  .shot { text-align: center; margin: 22px 0 10px; }
  .shot img {
    width: min(640px, 100%); image-rendering: pixelated;
    border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 12px 60px rgba(194, 59, 34, 0.18);
  }
  .caption { font-size: 14px; color: var(--dim); margin-top: 8px; }

  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 26px 0 8px; }
  .btn {
    display: inline-block; padding: 12px 22px; border-radius: 8px;
    text-decoration: none; font-family: Verdana, sans-serif; font-size: 15px;
    border: 1px solid var(--line); color: var(--fg); background: var(--panel);
  }
  .btn.primary { background: var(--red); border-color: var(--red2); color: #fff; }
  .btn:hover { filter: brightness(1.15); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 26px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .stat b { display: block; font-size: 26px; font-family: Verdana, sans-serif; color: var(--red2); }
  .stat span { font-size: 14px; color: var(--dim); }

  video { width: 100%; border-radius: 8px; border: 1px solid var(--line); }
  .scrub { width: 100%; margin-top: 8px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin: 14px 0; }
  .statebox {
    background: #0a0908; border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; font-size: 13px; overflow-x: auto; white-space: pre;
    line-height: 1.5;
  }
  .statebox .del { background: rgba(194, 59, 34, 0.35); border-radius: 2px; }
  .statebox .ins { background: rgba(123, 201, 111, 0.28); border-radius: 2px; }
  .ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  .ctrl button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    padding: 7px 14px; border-radius: 6px; cursor: pointer; font: inherit;
  }
  .ctrl button:hover { border-color: var(--red2); }
  .rulechip {
    font-family: var(--mono); font-size: 14px; color: var(--green);
    background: rgba(123, 201, 111, 0.08); border: 1px solid rgba(123, 201, 111, 0.25);
    padding: 3px 10px; border-radius: 20px;
  }
  .explain { min-height: 3.2em; font-size: 15.5px; }

  .anat { font-size: 13px; line-height: 2.0; word-break: break-all; }
  .anat span { padding: 2px 1px; border-radius: 3px; cursor: help; transition: background 0.15s; }
  .anat span:hover, .anat span.hot { outline: 1px solid var(--amber); background: rgba(224, 164, 88, 0.15); }
  .anat-tip { margin-top: 10px; padding: 10px 14px; background: var(--panel2); border-radius: 6px; min-height: 3em; font-size: 15px; }

  .toy textarea {
    width: 100%; background: #0a0908; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px; font-size: 14px; resize: none;
  }
  .toy .matched { font-size: 14px; margin-top: 8px; }
  .toy pre { background: #0a0908; border: 1px solid var(--line); border-radius: 6px; padding: 10px; font-size: 12.5px; overflow-x: auto; }

  .tl img { width: 100%; border-radius: 8px; border: 1px solid var(--line); image-rendering: pixelated; }
  footer { margin: 60px 0 40px; text-align: center; font-size: 14px; color: var(--dim); }
  ul { padding-left: 1.2em; }
  li { margin: 0.35em 0; }
</style>
</head>
<body>
<div class="lang">
  <button id="lang-en" class="on" onclick="setLang('en')">EN</button>
  <button id="lang-ru" onclick="setLang('ru')">RU</button>
</div>

<header class="wrap">
  <div class="dim mono" style="font-size:13px" data-i="tagline"></div>
  <h1 data-i="title"></h1>
  <p style="max-width:640px;margin:0 auto" data-i="subtitle"></p>
</header>

<div class="wrap">
  <div class="shot">
    <img src="render_timelapse.gif" alt="the machine painting E1M1, writes in green">
    <div class="caption" data-i="shot_cap"></div>
  </div>

  <div class="btns">
    <a class="btn primary" href="https://github.com/4RH1T3CT0R7/doom-regex" data-i="btn_gh"></a>
    <a class="btn" href="https://github.com/4RH1T3CT0R7/doom-regex/releases/latest" data-i="btn_demo"></a>
  </div>

  <div class="stats">
    <div class="stat"><b>13 994 067</b><span data-i="st_subs"></span></div>
    <div class="stat"><b>544</b><span data-i="st_rules"></span></div>
    <div class="stat"><b>96.6 MB</b><span data-i="st_state"></span></div>
    <div class="stat"><b>~80 000/s</b><span data-i="st_speed"></span></div>
  </div>

  <h2 data-i="h_what"></h2>
  <p data-i="p_what1"></p>
  <p data-i="p_what2"></p>
  <p data-i="p_what3"></p>

  <h2 data-i="h_clip"></h2>
  <p data-i="p_clip"></p>
  <div class="panel">
    <video id="clip" src="doom_regex_clip.mp4" poster="clip_poster.png" loop muted playsinline></video>
    <input class="scrub" id="scrub" type="range" min="0" max="1000" value="0">
    <div class="ctrl">
      <button onclick="clipPlay()" id="playbtn" data-i="b_play"></button>
      <span class="dim" style="font-size:14px" data-i="clip_note"></span>
    </div>
  </div>

  <h2 data-i="h_micro"></h2>
  <p data-i="p_micro"></p>
  <div class="panel">
    <div class="ctrl">
      <button onclick="mStep(-1)">◀</button>
      <button onclick="mStep(1)">▶</button>
      <button onclick="mAuto()" id="mauto" data-i="b_auto"></button>
      <span class="rulechip" id="mrule"></span>
      <span class="dim mono" id="mcount" style="font-size:13px"></span>
    </div>
    <div class="dim" style="font-size:13px" data-i="lbl_before"></div>
    <div class="statebox" id="mbefore"></div>
    <div class="dim" style="font-size:13px;margin-top:8px" data-i="lbl_after"></div>
    <div class="statebox" id="mafter"></div>
    <p class="explain" id="mexplain"></p>
  </div>

  <h2 data-i="h_anat"></h2>
  <p data-i="p_anat"></p>
  <div class="panel">
    <div class="dim" style="font-size:13px;margin-bottom:6px" data-i="anat_name"></div>
    <div class="anat mono" id="anat"></div>
    <div class="anat-tip" id="anat-tip" data-i="anat_hint"></div>
  </div>

  <h2 data-i="h_toy"></h2>
  <p data-i="p_toy"></p>
  <div class="panel toy">
    <textarea id="toy-state" rows="2" spellcheck="false"></textarea>
    <div class="ctrl">
      <button onclick="toyStep()" data-i="b_step"></button>
      <button onclick="toyReset()" data-i="b_reset"></button>
      <span class="matched" id="toy-matched"></span>
    </div>
    <details>
      <summary class="dim" style="cursor:pointer" data-i="toy_show"></summary>
      <pre id="toy-rules"></pre>
    </details>
  </div>

  <h2 data-i="h_tl"></h2>
  <p data-i="p_tl"></p>
  <div class="tl"><img src="e1m1_frame.png" alt="the finished frame"></div>

  <h2 data-i="h_honest"></h2>
  <p data-i="p_honest1"></p>
  <ul>
    <li data-i="li_h1"></li>
    <li data-i="li_h2"></li>
    <li data-i="li_h3"></li>
  </ul>

  <footer>
    <span data-i="footer"></span> |
    <a href="https://github.com/4RH1T3CT0R7/doom-regex">github.com/4RH1T3CT0R7/doom-regex</a>
  </footer>
</div>

let LANG = (navigator.language || "en").startsWith("ru") ? "ru" : "en";

function setLang(l) {
  LANG = l;
  document.documentElement.lang = l;
  document.getElementById("lang-en").classList.toggle("on", l === "en");
  document.getElementById("lang-ru").classList.toggle("on", l === "ru");
  for (const el of document.querySelectorAll("[data-i]")) {
    const k = el.getAttribute("data-i");
    if (I18N[l][k] !== undefined) el.textContent = I18N[l][k];
  }
  mShow(mIdx);           // перерисовать пояснение
  anatTip(null);
  toyRules();
}

// ---------- клип: play/scrub ----------
const clip = document.getElementById("clip");
const scrub = document.getElementById("scrub");
function clipPlay() {
  const b = document.getElementById("playbtn");
  if (clip.paused) { clip.play(); b.textContent = I18N[LANG].b_pause; }
  else { clip.pause(); b.textContent = I18N[LANG].b_play; }
}
clip.addEventListener("timeupdate", () => {
  if (clip.duration) scrub.value = (clip.currentTime / clip.duration) * 1000;
});
scrub.addEventListener("input", () => {
  if (clip.duration) clip.currentTime = (scrub.value / 1000) * clip.duration;
});

// ---------- микроскоп: реальные проходы ----------
const MICRO = JSON.parse(document.getElementById("micro-data").textContent);
let mIdx = 0, mTimer = null;
function ruleKey(r) {
  if (r.startsWith("movi")) return "ex_movi";
  if (r.startsWith("pcinc")) return "ex_pcinc";
  if (r.startsWith("fetch")) return "ex_fetch";
  if (r.startsWith("addi")) return "ex_addi";
  if (r.startsWith("add")) return "ex_add";
  if (r.includes("fb")) return "ex_store";
  if (r.startsWith("mul")) return "ex_mul";
  if (r.startsWith("hlt")) return "ex_hlt";
  return "ex_generic";
}
function hl(text, span, cls) {
  const [a, b] = span;
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  return esc(text.slice(0, a)) + '<span class="' + cls + '">' +
         esc(text.slice(a, b)) + "</span>" + esc(text.slice(b));
}
function mShow(i) {
  const fr = MICRO.frames[i];
  if (!fr) return;
  document.getElementById("mbefore").innerHTML = hl(fr.before, fr.hl_b, "del");
  document.getElementById("mafter").innerHTML = hl(fr.after, fr.hl_a, "ins");
  document.getElementById("mrule").textContent = fr.rule;
  document.getElementById("mcount").textContent =
    "pass " + (i + 1) + "/" + MICRO.frames.length + " | len " + fr.len.toLocaleString();
  document.getElementById("mexplain").textContent = I18N[LANG][ruleKey(fr.rule)];
}
function mStep(d) {
  mIdx = (mIdx + d + MICRO.frames.length) % MICRO.frames.length;
  mShow(mIdx);
}
function mAuto() {
  const b = document.getElementById("mauto");
  if (mTimer) { clearInterval(mTimer); mTimer = null; b.textContent = I18N[LANG].b_auto; }
  else { mTimer = setInterval(() => mStep(1), 1400); b.textContent = I18N[LANG].b_stop; }
}

// ---------- анатомия правила ----------
const ANAT = [
  ["\ARVM1\|ST:run\|PH:0\|", {
    en: "Anchor and gates. \A pins the match to the very start of the string, then three literal fields must match: the RVM1 magic, a live machine (ST:run), and the execute phase (PH:0). A rule whose turn it isn't fails here, within the first characters - that is what keeps 544 rules cheap.",
    ru: "Якорь и гейты. \A прибивает матч к самому началу строки, дальше обязаны совпасть три литеральных поля: магия RVM1, живая машина (ST:run) и фаза исполнения (PH:0). Правило, которому сейчас не время, проваливается здесь, на первых символах - поэтому 544 правила обходятся дёшево." }],
  ["CI:(?<ci>23(?<d>[0-7]).", {
    en: "Opcode check in the instruction cache. The literal 23 is STOREI's opcode; if the cached instruction starts with anything else, the rule fails in O(1). The source register number - the one whose value will be stored - is captured as 'd'.",
    ru: "Проверка опкода в кэше инструкции. Литерал 23 - опкод STOREI; если закэшированная инструкция начинается с другого, правило отваливается за O(1). Номер регистра-источника - того, чьё значение попадёт в память - захватывается группой 'd'." }],
  ["00(?>(?=[4-7c-f])(?<na52>)|)(?>(?=[2367abef])(?<na51>)|)(?>(?=[13579bdf])(?<na50>)|)[0-6]...", {
    en: "Address capture with bit markers. While the rule reads the address digits, empty named groups like 'na52' get set - or not - depending on the bits of each digit (the class [4-7c-f] means 'bit 2 is set'). The markers consume no text; they just remember the bits for later.",
    ru: "Захват адреса с бит-маркерами. Пока правило читает цифры адреса, пустые именованные группы вроде 'na52' ставятся - или нет - в зависимости от битов каждой цифры (класс [4-7c-f] значит 'бит 2 установлен'). Маркеры не съедают текст - они просто запоминают биты на потом." }],
  ["(?=...R(?P=d):(?<v>.{8}))", {
    en: "Reading the register. A lookahead walks to the register whose name equals the captured digit 'd' - a backreference inside the register's tag - and captures its 8 hex digits as 'v' without consuming anything.",
    ru: "Чтение регистра. Lookahead доходит до регистра, чьё имя равно захваченной цифре 'd' - обратная ссылка прямо внутри тега регистра - и захватывает его 8 hex-цифр группой 'v', ничего не съедая." }],
  ["(?<pre>(?s:.{47408})", {
    en: "The base jump. This consumes exactly 47 408 characters - the header and the lookup tables - and lands at the start of the flat memory zone: 58 720 256 characters of slots, eight hex digits per word.",
    ru: "Базовый прыжок. Здесь съедается ровно 47 408 символов - заголовок и таблицы - и матч оказывается на старте плоской зоны памяти: 58 720 256 символов слотов, по восемь hex-цифр на слово." }],
  ["(?(na52)(?s:.{65535}x512)|)(?(na51)(?s:.{65535}x256)|)...", {
    en: "The binary tree. Each conditional group asks 'was bit marker na52 set?' and, if yes, skips another exact distance: 33 554 432 characters for that bit (spelled as 512 blocks of .{65535} - regex repetition tops out at 65 535), then 16 777 216, and so on down to 8. The taken branches add up to exactly 8 x address: the match lands on the right slot with zero scanning.",
    ru: "Бинарное дерево. Каждая условная группа спрашивает: 'стоял ли бит-маркер na52?' - и если да, пропускает ещё одно точное расстояние: 33 554 432 символа за этот бит (записано 512 блоками .{65535} - повтор в regex ограничен 65 535), дальше 16 777 216 и так вниз до 8. Сумма взятых веток - ровно 8 x адрес: матч попадает в нужный слот вообще без сканирования." }],
  [").{8}", {
    en: "The payload. Everything before the slot was captured as 'pre'; these 8 characters are the old value, consumed and thrown away. The replacement writes ${pre}${v} - the untouched prefix, then the register value. One memory write - done.",
    ru: "Полезная нагрузка. Всё до слота захвачено группой 'pre'; эти 8 символов - старое значение, оно съедается. Замена пишет ${pre}${v} - нетронутый префикс и значение регистра. Одна запись в память - готово." }],
];
const anatEl = document.getElementById("anat");
ANAT.forEach(([frag], i) => {
  const s = document.createElement("span");
  s.textContent = frag;
  s.onmouseenter = () => anatTip(i);
  s.onclick = () => anatTip(i);
  anatEl.appendChild(s);
});
function anatTip(i) {
  const tip = document.getElementById("anat-tip");
  for (const [k, s] of [...anatEl.children].entries())
    s.classList.toggle("hot", k === i);
  tip.textContent = i === null ? I18N[LANG].anat_hint : ANAT[i][1][LANG];
}

// ---------- игрушечная машина ----------
const TOY_INIT = "TOY|ST:run|CNT:0097|#D0123456789";
const TOY_RULES = [
  ["inc", /^(TOY\|ST:run\|CNT:\d*)(\d)(?=9*\|)(?![9]\d*\|)(?<tail>9*)\|(?=.*#D\d*?\2(?<next>\d))/,
   null],  // заполняется ниже - JS не даёт \2 в lookahead легко, делаем проще
];
// три правила, как в большой машине: лестница инкремента
const TOY = [
  { name: "inc_last",
    re: /^(?<pre>TOY\|ST:run\|CNT:\d{3})(?<d>[0-8])(?=\|)(?<mid>[\s\S]*#D\d*?)(?=\d)/,
    // хвостовая цифра не 9: следующая цифра из #D
    apply(s) {
      const m = s.match(/^(?<pre>TOY\|ST:run\|CNT:\d{3})(?<d>[0-8])\|(?<rest>[\s\S]*)$/);
      if (!m) return null;
      const t = m.groups.rest.match(new RegExp("#D\\d*?" + m.groups.d + "(?<next>\\d)"));
      if (!t) return null;
      return m.groups.pre + t.groups.next + "|" + m.groups.rest;
    },
    show: 'P: ^(?<pre>TOY\\|ST:run\\|CNT:\\d{3})(?<d>[0-8])\\|(?=[\\s\\S]*#D\\d*?\\k<d>(?<next>\\d))\nR: ${pre}${next}|...' },
  { name: "inc_carry",
    re: null,
    apply(s) {
      const m = s.match(/^(?<pre>TOY\|ST:run\|CNT:\d*)(?<d>[0-8])(?<nines>9+)\|(?<rest>[\s\S]*)$/);
      if (!m) return null;
      const t = m.groups.rest.match(new RegExp("#D\\d*?" + m.groups.d + "(?<next>\\d)"));
      if (!t) return null;
      return m.groups.pre + t.groups.next + "0".repeat(m.groups.nines.length) + "|" + m.groups.rest;
    },
    show: 'P: ^(?<pre>TOY\\|…CNT:\\d*)(?<d>[0-8])(?<nines>9+)\\|(?=[\\s\\S]*#D\\d*?\\k<d>(?<next>\\d))\nR: ${pre}${next}000...|' },
  { name: "wrap",
    re: null,
    apply(s) {
      const m = s.match(/^(?<pre>TOY\|ST:run\|CNT:)9999\|(?<rest>[\s\S]*)$/);
      if (!m) return null;
      return m.groups.pre + "0000|" + m.groups.rest;
    },
    show: 'P: ^(?<pre>TOY\\|ST:run\\|CNT:)9999\\|\nR: ${pre}0000|' },
];
function toyReset() {
  document.getElementById("toy-state").value = TOY_INIT;
  document.getElementById("toy-matched").textContent = "";
}
function toyStep() {
  const ta = document.getElementById("toy-state");
  for (const r of TOY) {
    const out = r.apply(ta.value);
    if (out !== null) {
      ta.value = out;
      document.getElementById("toy-matched").textContent =
        I18N[LANG].toy_matched + r.name;
      return;
    }
  }
  document.getElementById("toy-matched").textContent = I18N[LANG].toy_halted;
}
function toyRules() {
  const keys = ["toy_r1", "toy_r2", "toy_r3"];
  document.getElementById("toy-rules").textContent =
    TOY.map((r, i) => "# " + r.name + " - " + I18N[LANG][keys[i]] + "\n" + r.show)
       .join("\n\n");
}

// ---------- init ----------
toyReset();
setLang(LANG);
mShow(0);
</script>
