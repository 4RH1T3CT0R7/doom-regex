                - button "Outline" [ref=f3e417] [cursor=pointer]
              - article [ref=f3e421]:
                - generic [ref=f3e422]:
                  - heading "DOOM on regex" [level=1] [ref=f3e423]
                  - 'link "Permalink: DOOM on regex" [ref=f3e424] [cursor=pointer]':
                    - /url: "#doom-on-regex"
                - paragraph [ref=f3e427]: DOOM, running on a computer whose only instruction is a regex find-and-replace.
                - paragraph [ref=f3e428]: The entire machine is one long string. Registers, RAM, the framebuffer and the DOOM engine itself live in that string as plain text. A small driver applies a fixed, ordered list of substitution rules to it, over and over. Whichever rule matches first fires once - that's a step. There is no interpreter and no arithmetic anywhere outside the rules. Delete the ruleset and you're left with a text file.
                - paragraph [ref=f3e429]: "This is the machine painting a frame. Green marks the pixels the current substitutions are writing: walls go down column by column, floors span by span, and the pauses are the BSP traversal thinking between strokes. Every green stroke is a regex replacing a few characters inside a 96.6 MB string:"
                - paragraph [ref=f3e430]:
                  - link [ref=f3e431] [cursor=pointer]:
                    - /url: https://4rh1t3ct0r7.github.io/doom-regex/
                    - img "Open the interactive site" [ref=f3e432]
                - paragraph [ref=f3e433]:
                  - text: One frame of E1M1 takes
                  - strong [ref=f3e434]: 13 994 067 substitutions
                  - text: "and comes out byte-identical (SHA-256) to the same frame rendered by natively compiled DOOM. And it's not a single lucky frame - here are a hundred frames of the built-in timedemo, the player grabbing the shotgun while demons close in. Every one of the hundred matches the native oracle byte for byte:"
                - paragraph:
                  - generic:
                    - link:
                      - /url: /4RH1T3CT0R7/doom-regex/blob/main/docs/doom_regex_clip.gif
                - generic [ref=f3e435]:
                  - heading "Why this is even possible" [level=2] [ref=f3e436]
                  - 'link "Permalink: Why this is even possible" [ref=f3e437] [cursor=pointer]':
                    - /url: "#why-this-is-even-possible"
                - paragraph [ref=f3e440]:
                  - text: Iterated string rewriting is Turing-complete - it's a Markov algorithm, one of the classic models of computation. So the question was never
                  - emphasis [ref=f3e441]: whether
                  - text: a pile of regexes can run DOOM, but whether it can do it before the heat death of the universe, and how you prove it isn't cheating.
                - paragraph [ref=f3e442]: "The rules implement a small 32-bit CPU (RVM-1):"
                - list [ref=f3e443]:
                  - listitem [ref=f3e444]:
                    - strong [ref=f3e445]: State
                    - text: is a string like
                    - code [ref=f3e446]: RVM1|ST:run|PH:0|CI:...|PC:00046bbc|R0:...|R7:...|CLK:...|
                    - text: "followed by zones: lookup tables, flat RAM ("
                    - code [ref=f3e447]: "#N"
                    - text: ), the program (
                    - code [ref=f3e448]: "#P"
                    - text: ), the framebuffer (
                    - code [ref=f3e449]: "#F"
                    - text: ), the WAD (
                    - code [ref=f3e450]: "#W"
                    - text: ), sparse high memory (
                    - code [ref=f3e451]: "#M"
                    - text: ), and the I/O tail.
                  - listitem [ref=f3e452]:
                    - strong [ref=f3e453]: Addition
                    - text: is eight lookahead probes into a 512-entry full-adder table, carry threaded through capture groups. Multiplication and division run as micro-phases with a transient accumulator field in the header.
                  - listitem [ref=f3e454]:
                    - strong [ref=f3e455]: Memory access
                    - text: jumps an
                    - emphasis [ref=f3e456]: exact number of characters
                    - text: into the flat RAM zone. The jump length is assembled from the address digits by empty "bit marker" groups and conditional jumps - a binary tree spelled in regex. No scanning; landing on a slot is O(1).
                  - listitem [ref=f3e457]:
                    - strong [ref=f3e458]: Fetch
                    - text: does the same trick with the program counter to find the current instruction slot.
                - paragraph [ref=f3e459]:
                  - text: DOOM (via
                  - link "doomgeneric" [ref=f3e460] [cursor=pointer]:
                    - /url: https://github.com/ozkl/doomgeneric
                  - text: ) is compiled to this CPU with
                  - link "8cc and ELVM" [ref=f3e461] [cursor=pointer]:
                    - /url: https://github.com/shinh/elvm
                  - text: ", following the trail blazed by"
                  - link "BFDoom" [ref=f3e462] [cursor=pointer]:
                    - /url: https://github.com/jasperdevs/BFDoom
                  - text: .
                - generic [ref=f3e463]:
                  - heading "How you know it's honest" [level=2] [ref=f3e464]
                  - 'link "Permalink: How you know it''s honest" [ref=f3e465] [cursor=pointer]':
                    - /url: "#how-you-know-its-honest"
                - paragraph [ref=f3e468]: "It would be easy to hide computation in the driver, so the contract is strict:"
                - list [ref=f3e469]:
                  - listitem [ref=f3e470]:
                    - text: "The driver may only: apply substitutions, copy I/O bytes in and out, and check two literal stop markers ("
                    - code [ref=f3e471]: "|ST:hlt"
                    - text: ","
                    - code [ref=f3e472]: "|ST:err"
                    - text: ). It never parses the state and never computes anything from it.
                  - listitem [ref=f3e473]: The ruleset is hashed before the run; the driver refuses a modified file.
                  - listitem [ref=f3e474]: Every performance shortcut (in-place splicing, skipping bytes that a substitution provably leaves in place) has a slow reference mode that must produce byte-identical states, enforced by tests.
                  - listitem [ref=f3e475]:
                    - text: A reference emulator executes the same ISA in Python. The lockstep test suite requires the string to equal the emulator's encoded state
                    - strong [ref=f3e476]: after every single substitution
                    - text: . The rendered frames match natively compiled DOOM. Three independent oracles, one answer.
                - paragraph [ref=f3e477]: When a limit error ever comes back from the regex engine (backtracking budget, JIT stack), the driver halts loudly rather than reinterpreting it as "no match" - that distinction once cost us a night of debugging a frame that ended cleanly in the wrong place.
                - generic [ref=f3e478]:
                  - heading "Numbers" [level=2] [ref=f3e479]
                  - 'link "Permalink: Numbers" [ref=f3e480] [cursor=pointer]':
                    - /url: "#numbers"
                - table [ref=f3e484]:
                  - rowgroup [ref=f3e485]:
                    - row [ref=f3e486]:
                      - columnheader [ref=f3e487]
                      - columnheader [ref=f3e488]
                  - rowgroup [ref=f3e489]:
                    - row [ref=f3e490]:
                      - cell "rewrite rules" [ref=f3e491]
                      - cell "544, fixed and SHA-256-hashed before the run" [ref=f3e492]
                    - row [ref=f3e493]:
                      - cell "machine state" [ref=f3e494]
                      - cell "one string, 96.6 MB" [ref=f3e495]
                    - row [ref=f3e496]:
                      - cell "one frame of E1M1" [ref=f3e497]
                      - cell "13 994 067 substitutions" [ref=f3e498]
                    - row [ref=f3e499]:
                      - cell "the 100-frame clip" [ref=f3e500]
                      - cell "~1.25 billion substitutions" [ref=f3e501]
                    - row [ref=f3e502]:
                      - cell "speed" [ref=f3e503]
                      - cell "~25 000 substitutions/s (PCRE2 with JIT, one core)" [ref=f3e504]
                    - row [ref=f3e505]:
                      - cell "first working build" [ref=f3e506]
                      - cell "7 substitutions/s - the frame took 12 hours" [ref=f3e507]
                - paragraph [ref=f3e508]: "The 3500x between the first and the last row is its own story: digit-tree fetch instead of scanning the program zone, dotall jumps so the JIT advances a pointer instead of scanning for newlines, a flat memory zone instead of a sparse cell scan, and an identity-skip splice so an 80 MB prefix that a substitution keeps verbatim is never copied at all."
                - generic [ref=f3e509]:
                  - heading "Try it" [level=2] [ref=f3e510]
                  - 'link "Permalink: Try it" [ref=f3e511] [cursor=pointer]':
                    - /url: "#try-it"
                - paragraph [ref=f3e514]:
                  - strong [ref=f3e515]:
                    - link "Download the demo" [ref=f3e516] [cursor=pointer]:
                      - /url: https://github.com/4RH1T3CT0R7/doom-regex/releases/latest
                  - text: "- unzip, double-click"
                  - code [ref=f3e517]: doomregex_demo.exe
                  - text: "(Windows). It launches the real machine on the real ruleset and shows the frame being rendered live, along with the substitution feed: which rule fired, what it consumed, what it wrote. A frame takes about half an hour of watching the machine paint."
                - paragraph [ref=f3e518]: "Or build everything yourself:"
                - generic [ref=f3e519]:
                  - code [ref=f3e521]: "# rules py -3.11 vm/genpattern.py # driver (gcc + static PCRE2, LINK_SIZE=4) bash scripts/build_driver.sh # run the machine rvm.exe --rules vm/rules_rvm.rgxset --state snapshot.rvstate"
                  - button "Copy code to clipboard" [ref=f3e523] [cursor=pointer]
                - paragraph [ref=f3e527]:
                  - text: The test suite (
                  - code [ref=f3e528]: py -3.11 -m pytest tests/
                  - text: ) runs the lockstep diff against the reference emulator, driver agreement tests (the C driver and a Python prototype must produce identical bytes), and golden checks.
                - generic [ref=f3e529]:
                  - heading "Prior art, and what's new here" [level=2] [ref=f3e530]
                  - 'link "Permalink: Prior art, and what''s new here" [ref=f3e531] [cursor=pointer]':
                    - /url: "#prior-art-and-whats-new-here"
                - list [ref=f3e534]:
                  - listitem [ref=f3e535]:
                    - text: Nicholas Carlini's
                    - link "Regex Chess" [ref=f3e536] [cursor=pointer]:
                      - /url: https://nicholas.carlini.com/writing/2025/regex-chess.html
                    - text: "plays chess with 84 688 substitutions - but as a fixed straight-line sequence, deliberately not Turing-complete. This project is the other branch: a fixed"
                    - emphasis [ref=f3e537]: cyclic
                    - text: ruleset, real model-of-computation territory.
                  - listitem [ref=f3e538]:
                    - link "BFDoom" [ref=f3e539] [cursor=pointer]:
                      - /url: https://github.com/jasperdevs/BFDoom
                    - text: runs DOOM compiled to Brainfuck. No regex involved; we borrowed their ELVM toolchain patches gratefully.
                  - listitem [ref=f3e540]: sed has Tetris and Sokoban; esolang folks proved iterated regex replacement Turing-complete years ago.
                - paragraph [ref=f3e541]: As far as we can tell, nobody had run DOOM - or any game, or any video - on an iterated regex substitution loop before. If you know prior art we missed, open an issue.
                - generic [ref=f3e542]:
                  - heading "Repository map" [level=2] [ref=f3e543]
