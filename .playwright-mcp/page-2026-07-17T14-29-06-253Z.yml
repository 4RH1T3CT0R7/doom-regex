    - img "the finished frame" [ref=f2e69]
    - heading "Правила честности" [level=2] [ref=f2e70]
    - paragraph [ref=f2e71]: "В таком проекте легко сжульничать, спрятав вычисления в драйвер. Здесь контракт жёсткий:"
    - list [ref=f2e72]:
      - listitem [ref=f2e73]: Драйвер только применяет подстановки, копирует байты ввода-вывода и проверяет два литеральных маркера останова. Он никогда не разбирает состояние и не считает по нему ничего.
      - listitem [ref=f2e74]: Набор правил фиксируется и хешируется SHA-256 до запуска; изменённый файл драйвер не примет.
      - listitem [ref=f2e75]: У каждого трюка производительности (замена на месте, пропуск неизменённых байтов) есть медленный эталонный режим, обязанный давать байт-идентичные состояния - это проверяется тестами.
