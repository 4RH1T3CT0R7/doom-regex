    - heading "Попробуйте сами" [level=2] [ref=f2e57]
    - paragraph [ref=f2e58]: "Крошечная версия той же идеи прямо в браузере, на regex-движке JavaScript: счётчик, который увеличивается, переписывая собственные цифры. Инкремент сделан так же, как в большой машине - следующая цифра ищется в таблице #D, которая лежит в той же строке. Нажимайте кнопку и смотрите, какое правило срабатывает."
