    - heading "Анатомия правила" [level=2] [ref=f2e51]
    - paragraph [ref=f2e52]: "Настоящее правило из набора - то, что исполняет STOREI в плоскую память. Наведите на части, чтобы увидеть, что делает каждая. Страшный прыжок в середине - это и есть адресация памяти: машина пропускает точное число символов, собранное из цифр адреса условными группами, как бинарное дерево."
