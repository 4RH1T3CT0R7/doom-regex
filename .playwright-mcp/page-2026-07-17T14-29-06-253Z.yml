    - heading "Что здесь происходит" [level=2] [ref=f2e25]
    - paragraph [ref=f2e26]: "Вся машина - одна длинная строка. Регистры, память, фреймбуфер, движок DOOM, скомпилированный в самодельную систему команд, - всё лежит в этой строке обычным текстом. Драйвер применяет к ней фиксированный упорядоченный список правил поиска-замены. Какое правило совпало первым - то и срабатывает, один раз. Это шаг. Другого вычисления нет: ни интерпретатора, ни арифметики на стороне хоста. Удалите правила - останется текстовый файл."
    - paragraph [ref=f2e27]: "Это работает, потому что итерированная замена строк Тьюринг-полна - это алгоритм Маркова, классическая модель вычислений из 1950-х. Правила реализуют маленький 32-битный процессор: сумматор - таблица сумм шестнадцатеричных цифр, переходы - навигация по группам захвата, выборка инструкции - буквальный прыжок на N символов вглубь секции программы. DOOM скомпилирован в этот процессор через 8cc и ELVM."
    - paragraph [ref=f2e28]: Каждый шаг проверен. Референсный эмулятор исполняет ту же систему команд на Python; после каждой подстановки строка обязана совпасть с закодированным состоянием эмулятора байт в байт. SHA-256 отрендеренного кадра совпадает с нативно скомпилированным DOOM. Три независимых оракула - один ответ.
    - heading "Сто кадров настоящей игры" [level=2] [ref=f2e29]
    - paragraph [ref=f2e30]: "Кадры 160-259 встроенного таймдемо: игрок подбирает броню, берёт дробовик, нападают демоны. Около 1,25 миллиарда подстановок. Каждый из 100 кадров байт в байт совпадает с нативным оракулом. Тяните ползунок, чтобы промотать."
